# 실시간 실행 — PEM 흔들림 원인 분석용 (진단 모드 ON)
#   conda activate sam6d && export ROS_DOMAIN_ID=72
#   ros2 launch realtime/launch/sam6d_realtime.launch.py config:=realtime/run_test_0807_185223.yaml

topics:
  rgb: /camera/camera/color/image_raw
  depth: /camera/camera/aligned_depth_to_color/image_raw
  caminfo: /camera/camera/color/camera_info

ism:
  config: configs/yolo_ism_objects.yaml
  objects: []

runtime:
  device: cuda:0
  use_sim_time: true
  sync_slop: 0.02
  sync_queue: 2
  det_score_thresh: 0.2
  status_period_s: 1.0
  count_input_frames: true

output:
  dir: temp/rt_out_260804
  overlay_every: 0        # 오른쪽 화면은 사후 렌더로 만든다(같은 R,t 를 쓴다)
  write_jsonl: true
  diagnostics: true       # 마스크 PNG + PEM 입력 품질 + bag 시각 기준 시작/완료 시각

bag:
  play: true
  path: /home/ldh9501/temp_ws/CLI_environment/data_slam_converted/260804_office/longcircle2/SAM
  rate: 1.0
  clock: true
  ready_timeout: 600
  remap: {}
