<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>PEM Pose Explorer</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <div><p class="eyebrow">SAM-6D diagnostic workspace</p><h1 id="title">PEM Pose Explorer</h1></div>
    <div class="header-meta"><span id="dataset-source"></span><span id="frame-count"></span><span id="mode-badge"></span></div>
  </header>
  <section id="gt-notice" class="notice"></section>
  <main>
    <section class="stage">
      <div class="toolbar">
        <button id="prev" aria-label="previous frame">←</button>
        <input id="frame-slider" type="range" min="0" value="0">
        <button id="next" aria-label="next frame">→</button>
        <label>프레임 <input id="frame-search" type="number" min="0"></label>
        <span id="frame-label"></span>
      </div>
      <div class="viewport"><img id="frame-image" alt="RGB frame"><canvas id="pose-canvas"></canvas></div>
      <div class="axis-legend"><span class="front">● 정면</span><span class="up">● 위</span><span>화살표 축: manifest 설정</span></div>
      <div id="object-grid" class="object-grid"></div>
    </section>
    <aside id="details" class="details empty"><p>검출된 객체 카드를 선택하면 후보를 자세히 볼 수 있습니다.</p></aside>
  </main>
  <template id="slot-template">
    <button class="object-card"><span class="object-name"></span><span class="state"></span><span class="score"></span></button>
  </template>
  <script src="report-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
