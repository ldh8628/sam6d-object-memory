<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEM Pose Explorer</title><link rel="stylesheet" href="app.css"></head><body>
<header><div><p class="eyebrow">SAM-6D diagnostic workspace</p><h1 id="title">PEM Pose Explorer</h1></div><div class="header-meta"><span id="dataset-source"></span><span id="frame-count"></span><span id="profile-badge"></span></div></header>
<section id="notice" class="notice"></section><main><section class="stage"><div class="toolbar"><button id="prev">←</button><input id="frame-slider" type="range" min="0" value="0"><button id="next">→</button><label>프레임 <input id="frame-search" type="number" min="0"></label><span id="frame-label"></span></div>
<div class="viewport"><canvas id="frame-image" role="img" aria-label="bag RGB frame"></canvas><canvas id="pose-canvas"></canvas></div><div class="axis-legend"><span class="front">● 후보 CAD 투영</span><span>생산 pose 축: <b style="color:#ff4b55">X</b> <b style="color:#4ee58a">Y</b> <b style="color:#4aa8ff">Z</b></span><span id="rgb-source">RGB 준비 중</span></div><div id="object-grid" class="object-grid"></div></section>
<aside id="details" class="details empty"><p>객체 카드를 선택하면 실제 생산 결과와 후보를 표시합니다.</p></aside></main>
<template id="slot-template"><button class="object-card"><span class="object-name"></span><span class="state"></span><span class="score"></span></button></template><script src="app.js"></script></body></html>
