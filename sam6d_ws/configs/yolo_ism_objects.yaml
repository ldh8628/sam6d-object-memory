# Multi-object YOLO-World + SAM-6D ISM recognition config.
# Consumed by yolo_ism_object_n.py (reuses yolo_ism.py functions, no source edits).
#
# `defaults` = global operating point (milk ISM operating point).
# `objects[]` = per-object recognition target. Each object may override any
#   default key (e.g. similarity_threshold, appe_gate, top_k, yolo_prompt).
# PEM / 6D pose / geometric(depth) axes are OUT OF SCOPE here.

defaults:
  weights: yolov8m-worldv2.pt          # YOLO-World checkpoint (falls back to s)
  device: cuda:0
  top_k: 3                             # max YOLO proposals kept per object/frame
  score_threshold: 0.02                # YOLO-World confidence threshold
  # ---- Phase 1C: Hue-corrected render HSV hard gate (ACTIVE) ----
  # Gate runs AFTER semantic+appearance, on accepted candidates only. When enabled, an HSV
  # failure (color mismatch) removes the candidate. Authority = ism_hsv.py (verbatim port of
  # eval_pipeline_end2end mode B; runtime<->research parity 0.00e+00 on 18,060 candidates).
  hsv_gate_enabled: true               # Phase 1C: ACTIVE (F1 .676->.753, FP 334->86 validated)
  hsv_gate_shadow_mode: false          # true (+enabled:false) = compute & log only (Phase 1B shadow)
  hsv_gate_threshold: 0.12140          # FROZEN deploy value: LOO t*=0.1214 in all 6 folds (stable),
                                       #   F1-max on 6 pooled. B2 = TP616/FP86/FN319.
  hsv_hue_shift_deg: -6                # 0-360 convention; applied to REFERENCE as round(-6/2)=-3 (OpenCV)
  hsv_sat_gain: 1.3                    # REFERENCE saturation gain
  hsv_hist_bins: [16, 8]               # joint H x S histogram -> 128-D
  hsv_lowsat_exception: false          # pinned mode-B has NO low-sat exception (final decision)
  rg_gate_threshold: 0.0               # normalized-rg reject gate; 0 = disabled unless validated per object
  hsv_hue_correction_ocv: 0            # Phase 1C class color correction (OpenCV hue units), 0 = none.
                                       # Baked into the class HSV cache at BUILD time -> runtime stays
                                       # object-agnostic (no per-class branch). Dinosaur overrides to 9.
  # NOTE: texture negative verifier (choco vs brown box) and texture rescue verifier are NOT in the
  #   operational pipeline. negative-verifier = research shadow only (sam GT AUROC .834, not a clean
  #   gate). rescue-verifier = REJECTED (AUROC .508, readmits 194/248 FP). Neither affects decisions.
  # ---- Phase 2.2: Training-free gate decision improvement (DEFAULT OFF) ----
  # No learning / no GT-fit / no per-object params / no learned artifact (INV-01..05).
  # OFF (default) => exact Phase 1C (TP622/FP86/FN313/F1.7572). Validated offline:
  #   one_borderline_rescue = +28 TP / +14 FP / F1 .7572->.7715 (8 classes gain; FP mostly choco).
  #   Does NOT meet strict FP<=86 criterion -> kept OFF pending activation review.
  training_free_gate_enabled: false     # master switch; false = complete no-op
  training_free_gate_method: phase1c    # phase1c(off) | one_borderline_rescue
  # ---- Phase 3: appearance-v2 (block 2+9, matched gate) + cross-object NMS (DEFAULT OFF) ----
  # Training-free. No learned artifact, no per-object constant (INV-01..03).
  # OFF (both flags false) => byte-identical Phase 1C behaviour.
  #
  # Why this is NOT the 2026-07-15 revert repeating itself: that attempt shipped
  # appe_blocks [2,9] while LEAVING the gate at 0.55, so the raised score
  # distribution went slack and cartons flooded in. Here blocks and gate move as a
  # PAIR (0.605, derived on the 959-cell human-verified set, not per object).
  #
  # Human FP re-audit 2026-07-23 (all 166 FP of A/B1/B2 hand-labelled T/F):
  #   24 of them were REAL detections missing from the GT visible list
  #   (Mugcup 6/6, Bear 4/4, saffron 7/17) -> GT corrected 935 -> 959 visible cells.
  # Measured on that corrected GT:
  #   A  block11 g0.550            TP 645 FP 63 FN 314  F1 .7738   <- current default
  #   B2 block2+9 g0.605           TP 688 FP 96 FN 271  F1 .7894
  #   A  + cross-object NMS        TP 643 FP 31 FN 316  F1 .7875
  #   B2 + cross-object NMS        TP 670 FP 28 FN 289  F1 .8087   <- both flags on
  # Residual FP after both: 28, of which 24 are choco_hazelnut latching onto plain
  # brown shipping cartons -- a separate, long-standing problem, not caused here.
  #
  # PROMOTED TO DEFAULT 2026-07-23 on LOCATION-VERIFIED evidence. Every one of the
  # 117 detections that changed between OFF and ON was hand-judged on the single
  # question "is this box actually on that object?" -- because the aggregate labels
  # are location-blind: 9 of the 21 'lost TP' were a choco label sitting on a plain
  # brown carton, i.e. a correct deletion scored as a loss.
  #   added + real     47   (FN->TP)      removed + real      13   (TP->FN)
  #   added + wrong    22   (TN->FP)      removed + wrong     35   (FP->TN)
  #   net: TP +34, FP -13   =>  TP 551->585, FP 51->38, F1 .7060 -> .7396
  # Good/bad by class: Bear 9/0, Sikhye 6/0, Dinosaur 4/0, Mugcup 2/0, Rabbit 11/1,
  #   Febreze 12/2, choco 28/21, milk 6/6, saffron 2/3, Sauce 2/2.
  # Rollback = set both flags back to false (OFF is a verified exact no-op).
  appe_v2_enabled: true                # PROMOTED 2026-07-23 (see verdict below); false => exact Phase 1C
  appe_v2_blocks: [2, 9]               # early block = colour, mid block = texture; see appe_blocks notes
  appe_v2_gate: 0.605                  # gate MATCHED to [2,9]; never reuse appe_gate (0.55) with these blocks
  cross_object_nms_enabled: true       # PROMOTED 2026-07-23; false => no cross-object suppression
  cross_object_nms_iou: 0.9            # IoU at/above which two labels are judged to claim the SAME box
  # ---- Phase 4: multi-label proposals + per-box owner election + colour tie-break ----
  # Training-free. No learned artifact, no per-object constant (INV-01..03) — the
  # tie-break reads the template similarity matrix, it does not name a class.
  #
  # Why: YOLO-World scores a box as cos(region, prompt-embedding); the 10 deployed
  # prompts sit in a narrow cone (pairwise cosine .597-.851, "brown bear doll" vs
  # "white rabbit doll" = .778), so which prompt wins a box is decided by a hair —
  # and NMS then keeps ONLY that winner. Measured on 190624: the Sikhye can carried
  # `white jug 0.225` and the green dinosaur carried `brown bear doll 0.309`, so the
  # right label never reached the DINOv2/HSV gates at all. 31% of the "no candidate"
  # cells come back by simply letting the box keep every prompt.
  #
  # relative_assignment: instead of each object asking "does this box clear MY
  # thresholds", every distinct box is scored against every object and goes to the
  # best match; the absolute gates still run afterwards (FP control is their job).
  #
  # colour tie-break: DINOv2 cannot separate the three plush dolls (template cosine
  # Bear/Rabbit .83, Bear/Dinosaur .80, Rabbit/Dinosaur .83) while every other pair
  # is <= .63 — shape dominates and colour is ignored. When the runner-up is that
  # close in TEMPLATE space, the HSV score decides. tau is a similarity threshold on
  # data, not a class list, so adding an object needs no code change.
  #
  # 959-cell human-verified GT (2026-08-12, phase39):
  #   deployed                        TP 586  FP 37  FN 373  P .941  R .611  F1 .7408
  #   + multi_label                   TP 686  FP 33  FN 273  P .954  R .715  F1 .8176
  #   + relative assignment           TP 681  FP 32  FN 278  P .955  R .710  F1 .8146
  #   + colour tie-break tau 0.70     TP 706  FP 32  FN 253  P .957  R .736  F1 .8321
  #   + colour tie-break tau 0.60     TP 721  FP 35  FN 238  P .954  R .752  F1 .8408  <- shipped
  # FP does NOT rise: 37 -> 35. Residual FP is 14 choco-on-brown-carton (a separate,
  # long-standing problem) + 12 milk-on-small-white-labels. A minimum-box-area filter
  # was tried and rejected: at 400 px it drops 7 FP but also 7 TP (F1 .8321 -> .8307).
  # Rollback = set the three keys back to false / false / 0.0 (verified exact no-op).
  yolo_multi_label: true               # one box may keep EVERY prompt above conf
  relative_assignment_enabled: true    # per-box owner election instead of per-object thresholds
  color_tiebreak_template_sim: 0.60    # template cosine at/above which colour decides; 0 = off
  # YOLO-World inference resolution. Was 960 on the pre-Phase-4 logic, where 640->960
  # recovered small/distant milk (SAM_occlusion milk recall 7->56/80). That reason no
  # longer holds: once a box may carry several prompts, the extra proposals come from
  # multi_label rather than from pixels, and the larger input only blurs the winner.
  # Re-measured 2026-08-13 with Phase 4 on:
  #   959-cell human GT      640 TP725 FP34 F1 .8440 | 960 TP721 FP34 F1 .8413 | 1280 TP712 FP45 F1 .8298
  #   190624 location-verified  raising 640->960 ALONE made it worse: 671 -> 586 hits
  #                             (Dinosaur 53->12, choco 83->56)
  # 640 is also ~2x faster. Caveat kept on record: on 190624 the 640 variant trades
  # +31 located hits for +18 out-of-frame FP (62 -> 80).
  imgsz: 640
  similarity_threshold: 0.35           # semantic(cls) 1st gate
  use_mask: true                       # MobileSAM masked-appe 2nd gate
  appe_gate: 0.55                      # masked-appe 2nd-gate threshold. DO NOT raise globally:
                                       # appe is similarity to an object's OWN templates, so its
                                       # scale is per-object (median: saffron 0.750 .. choco 0.611).
                                       # choco's MAX (0.712) is below saffron's boundary (0.72) —
                                       # no single value serves both. Override per object instead.
                                       #
                                       # 2026-07-15 LAYER SWEEP -- the gate may be reading the wrong
                                       # layer. masked_appe_score currently uses FINAL-block (11 of
                                       # 12) patch tokens. Recomputed at every block on 84 choco
                                       # detections sampled evenly across all 6 datasets and hand-
                                       # labelled (36 real / 45 carton), separating real box from
                                       # plain carton by AUC:
                                       #   block  9 -> 0.996  (bootstrap CI 0.985-1.000)
                                       #   block 11 -> 0.934  (CURRENT)  CI 0.877-0.982
                                       # Per-dataset AUC block 9 = 1.000/1.000/1.000/1.000/0.938 vs
                                       # block 11 = 0.978/0.800/0.958/1.000/0.938. A 0.59 gate on
                                       # block 9 keeps 35/36 real and removes 43/45 cartons.
                                       # NOT YET APPLIED: verified on choco ONLY. Validate on the
                                       # other objects before changing the production layer --
                                       # block 9's win could be choco-specific.
                                       # Mechanism: DINOv2 CLS/pooled features are documented
                                       # shape-biased (NeurIPS 2025), and a striped snack box and a
                                       # plain carton are the same coarse shape; mid-block patch
                                       # tokens retain the texture signal (FoundPose, ECCV 2024 --
                                       # measured on ViT-L/23 layer 18; ours is ViT-S/14, 12 blocks,
                                       # so the transfer is circumstantial, not established).
  appe_blocks: [11]                    # DINOv2 blocks the masked-appe score averages over.
                                       # [11] = final block only = the historical behaviour
                                       # (bit-identical, max|diff|=0.0).
                                       #
                                       # !! [2, 9] WAS SHIPPED AND THEN REVERTED THE SAME DAY
                                       # (2026-07-15) AFTER A FULL 2,596-FRAME A/B. The ranking
                                       # evidence below is real and reproducible, but changing
                                       # appe_blocks WITHOUT recalibrating appe_gate is a NET
                                       # REGRESSION: [2,9] shifts the whole score distribution
                                       # upward, so the unchanged absolute gate (0.55) went slack
                                       # and detections rose 5,476 -> 6,357 (+16.1%). Eyeballing
                                       # the added detections (even sample per dataset):
                                       #   choco  +362  ~23 of 24 sampled were plain cartons  BAD
                                       #   milk   +173  ~half cartons                         BAD
                                       #   Mugcup +100  5 real mugs, 7 clear FP, rest blur     BAD
                                       #   Rabbit +104  ~16 of 20 real white rabbits          GOOD
                                       # choco FP would go from 377 to an estimated 700+.
                                       # To ship [2,9] the gate must be re-derived at a MATCHED
                                       # operating point. Per-object gates that reproduce the old
                                       # detection counts (measured): saffron .647 choco .593
                                       # Sikhye .646 Sauce .644 Febreze .589 Bear .550 milk .585
                                       # Mugcup .679 Dinosaur .652 Rabbit .725 -- i.e. per-object,
                                       # which is exactly the per-object-threshold trap that has
                                       # already been reverted three times here. Do not ship
                                       # [2,9] until that is solved.
                                       # WHY TWO BLOCKS: early blocks encode colour, late blocks
                                       # encode texture/semantics, and our objects fail in BOTH
                                       # ways -- so no single block can serve them all. Measured
                                       # AUC (real vs FP) per object, 501 hand-labelled detections
                                       # over 6 objects x 6 datasets:
                                       #                       block 2   block 9   block 11
                                       #   choco vs carton       0.55      1.00      0.93   <- same colour
                                       #   saffron vs carton     0.83      0.89      0.85   <- same colour
                                       #   milk vs carton        0.95      0.80      0.88   <- differs
                                       #   Febreze vs saffron    0.97      0.94      0.91   <- differs
                                       #   Bear vs rabbit/dino   0.92      0.49      0.56   <- differs
                                       #   Dinosaur vs rabbit    1.00      0.66      0.47   <- differs
                                       # Block 11 (the old setting) is WORSE THAN CHANCE on the
                                       # dolls: it ranks real green dinosaurs BELOW white rabbits,
                                       # so any gate cut real dinosaurs and kept every rabbit.
                                       # The operational metric -- share of false positives cut at
                                       # the threshold that keeps 100% of real objects:
                                       #   block 11 -> 20/117 (17%)      blocks [2,9] -> 44/117 (38%)
                                       #   per object: choco 31->56%, milk 38->50%, Febreze 5->29%,
                                       #   Dinosaur 0->64%, saffron 14->14%, Bear 0->0%.
                                       # No object got worse. Cost is +0.1%: get_intermediate_layers
                                       # runs the 12 blocks ONCE and only re-applies norm() per block
                                       # (a second forward would have been +104%).
                                       # Still unsolved: Bear (0% either way) and saffron (14%).
  nms_rank_blocks: [2, 9]              # blocks for the CROSS-OBJECT NMS ranking score only.
                                       # Unset = same as appe_blocks = no change.
                                       # This is the safe half of the 2026-07-15 finding: the
                                       # gate keeps its old score (so the operating point, and
                                       # therefore the detection count, cannot move), while the
                                       # question "two labels claim this same box -- which one
                                       # wins?" is decided by the better score. A ranking has no
                                       # threshold to slip, so there is no way for extra cartons
                                       # to leak in; if the detection count changes at all, that
                                       # is a bug, not a trade-off.
                                       # It matters most where the gate's block is actively
                                       # harmful: block 11 ranks a real green dinosaur BELOW a
                                       # white rabbit (AUC 0.47 = worse than chance); blocks [2,9]
                                       # score 0.99 on the same 84 detections.
  match_topk: 5                        # top-k template avg for semantic/appe
  seg_weights: mobile_sam.pt           # MobileSAM weights for proposal masking
  stride: 10                           # process every Nth frame
  # dinov2_checkpoint: <auto>          # default = yolo_ism.DEFAULT_DINOV2_CKPT
  # cls_cache / appe_cache auto-derived per object if omitted:
  #   outputs/yolo_ism_object_n/template_features/<name>_{cls,appe}.pt

objects:
  - name: milk
    yolo_prompt: "milk carton"
    # 'milk carton' also fires on any white rectangular box (e.g. the plastic-wrapped
    # iPTIME box, sam_105314 f146). An appe_gate of 0.63 was TRIED and REVERTED
    # (2026-07-15): it removed 43 detections but a visual check of them found ~2/3 were
    # REAL milk cartons. FP (iPTIME/choco box) and real milk overlap at 0.55-0.63 because
    # appe degrades with distance/blur, not just identity. No usable threshold found.
    object_id: Milk_high
    template_dir: template/milk_high/templates
    cad_ply: data/cad/milk_high/Milk_high.ply
    # 260826 six-run validation: 8,034 milk candidates, threshold .55 rejects 273
    # candidates across 39/39 visually checked false-only runs; lowest real milk = .575.
    rg_gate_threshold: 0.55
    # 2026-08-19 (AF2) 자산 교체. 이전: template/milk/templates + data/cad/milk/Milk.ply
    #   교체 이유 — 이전 Milk.ply 는 trimesh 변환본이라 UV·텍스처가 없고, 몸통 정점이
    #   36개뿐(표면적 80%가 흰색 거대 삼각형 28장)이어서 blenderproc 이 map_vertex_color()
    #   경로로 떨어져 '흰 상자'가 렌더된다(그 산출물이 template/fail/milk). 운영 중이던
    #   template/milk 는 지금은 없는 다른 텍스처 모델로 렌더한 것을 복사해 온 것이라
    #   재생성이 불가능했고, UV 오류로 본체 그림이 지붕까지 칠해져 있었다(cyan/남색 오류 포함).
    #   Milk_high.ply 는 나머지 9객체와 같은 Blender export 계통(UV 있음, 250k 정점)이고
    #   'comment TextureFile Milk_color.png' 를 넣어 두어 blenderproc 이 텍스처 경로를 탄다.
    #   치수 75.7 x 75.7 x 230.0 mm (이전 70.0 x 70.0 x 231.1). 뚜껑은 중심축에서 28.3mm
    #   (반폭의 75%) 앞쪽으로 편심 + 지붕 위 12.4mm 돌출 → 앞뒤 판별의 기하 단서.
    enabled: true

  - name: choco_hazelnut_high
    yolo_prompt: "maroon box"                  # 초코하임 dark-red snack box; reduces tan-cardboard FPs vs 'brown box' (object is small/distant → low recall regardless)
    # 'maroon box' still latches onto plain brown shipping cartons. The geometry can't
    # tell them apart (flat slab vs flat carton face) and PEM's pose_score is purely
    # geometric, so it scores those FPs 0.99-1.00.
    # An appe_gate of 0.59 was TRIED and REVERTED (2026-07-15) -- and the REVERT WAS
    # WRONG. The revert rested on "sam_110633 max appe is 0.594 -> 92% killed, nearly
    # all of them the REAL box", which was INFERRED from kill-rates without ever looking
    # at the crops. Measured later the same day on 84 choco detections sampled EVENLY
    # across all 6 datasets (14 each) and labelled by eye: sam_110633 holds 24 choco
    # detections TOTAL and its top-14 by appe are ALL plain cardboard cartons -- zero
    # real choco. Killing 92% there was killing false positives, i.e. correct.
    # On that labelled set the reverted gate scores 86% real kept / 84% FP removed.
    # The 275-detection "valley at 0.59" WAS still an artifact, but for a different
    # reason than recorded: Hartigan's dip test puts the appe distribution at p=0.91
    # (UNIMODAL) -- there is no valley to find, so any threshold picked by eye from a
    # histogram is unfounded. Thresholds on appe need labels; label-free valley-hunting
    # does not work on this signal.
    # See the 2026-07-15 layer sweep below before setting any appe gate here.
    object_id: choco_hazelnut_color_high
    template_dir: template/choco_hazelnut_color_high/templates
    cad_ply: data/cad/choco_hazelnut_color_high/choco_hazelnut_color_with_normal_vertexcolor.ply
    enabled: true

  - name: choco_hazelnut_low
    yolo_prompt: "brown box"
    object_id: choco_hazelnut_color_low
    template_dir: template/choco_hazelnut_color_low/templates
    cad_ply: data/cad/choco_hazelnut_color_low/choco_hazelnut_color_with_normal_vertexcolor.ply
    enabled: false  # low-texture template moved to fail/

  - name: Febreze_high
    yolo_prompt: "febreze spray bottle"
    object_id: Febreze_high
    template_dir: template/Febreze_high/templates
    cad_ply: data/cad/Febreze_high/Febreze_color_with_normal_vertexcolor.ply
    enabled: true

  - name: Febreze_low
    yolo_prompt: "febreze spray bottle"
    object_id: Febreze_low
    template_dir: template/Febreze_low/templates
    cad_ply: data/cad/Febreze_low/Febreze_color_with_normal_vertexcolor.ply
    enabled: false  # low-texture template moved to fail/

  - name: Mugcup_high
    yolo_prompt: "mug cup"
    object_id: Mugcup_color_high
    template_dir: template/Mugcup_color_high/templates
    cad_ply: data/cad/Mugcup_color_high/Mugcup_color_with_normal_vertexcolor.ply
    enabled: true

  - name: Mugcup_low
    yolo_prompt: "mug cup"
    object_id: Mugcup_color_low
    template_dir: template/Mugcup_color_low/templates
    cad_ply: data/cad/Mugcup_color_low/Mugcup_color_with_normal_vertexcolor.ply
    enabled: false  # low-texture template moved to fail/

  - name: saffron
    yolo_prompt: "white jug"                   # actual scene object = cream jug w/ handle (not soap)
    # highest-scoring object overall, yet the top FP source: when the real jug is
    # occluded it hallucinates onto the shipping carton's blank face.
    # An appe_gate of 0.72 was TRIED and REVERTED (2026-07-15): it removed 69 detections
    # but a visual check found ~2/3 were the REAL cream jug (appe 0.57-0.72). The earlier
    # "TP 0.722-0.820" boundary was overfit to 6 frames from one dataset (110633, jug seen
    # close/well-lit). appe drops with distance/angle/blur, so real-jug and FP ranges
    # overlap almost completely. saffron is NOT fixable by an appe threshold.
    object_id: saffron
    template_dir: template/saffron/templates
    cad_ply: data/cad/saffron/saffron_color_with_normal_vertexcolor.ply
    enabled: true

  - name: Sauce_high
    yolo_prompt: "orange bottle"
    object_id: Sauce_high
    template_dir: template/Sauce_high/templates
    cad_ply: data/cad/Sauce_high/Sauce_color_with_normal_vertexcolor.ply
    enabled: true
    # NOTE: Sauce is an ORANGE squeeze bottle (white cap, green base), not brown.

  - name: Sauce_low
    yolo_prompt: "brown bottle"
    object_id: Sauce_low
    template_dir: template/Sauce_low/templates
    cad_ply: data/cad/Sauce_low/Sauce_color_with_normal_vertexcolor.ply
    enabled: false  # low-texture template moved to fail/

  - name: Sikhye_high
    yolo_prompt: "yellow can"
    object_id: Sikhye_high
    template_dir: template/Sikhye_high/templates
    cad_ply: data/cad/Sikhye_high/Sikhye_color_with_normal_vertexcolor.ply
    enabled: true

  - name: Sikhye_low
    yolo_prompt: "yellow can"
    object_id: Sikhye_low
    template_dir: template/Sikhye_low/templates
    cad_ply: data/cad/Sikhye_low/Sikhye_color_with_normal_vertexcolor.ply
    enabled: false  # low-texture template moved to fail/

  # ── dolls (assets exist: CAD mm + 42 rendered templates; ISM cls/appe caches
  #    auto-derived on first run). Added for rgbd_imu_sdk_bag SAM_* scenes. ──
  # NOTE: the DINOv2 gates do not SEPARATE plush toys — all round matte blobs, so
  # any toy box passes every toy's gates. But passing is not ranking: measured on
  # 75 frames (2026-07-15), among the 3 toy labels claiming the SAME box, DINOv2
  # ranks the correct one FIRST almost always (110104 f19: Rabbit sem .652/appe
  # .780 > Bear .574/.746 > Dinosaur .510/.709 — and the object is a rabbit).
  # The old cross-object NMS ranked by YOLO confidence and threw that away, which
  # is where Rabbit's FP=0 / FN=258 came from. build_ism_inputs_imu.py now
  # defaults to --nms-rank appe (doll label 14/22 -> 22/22 on a confirmed control
  # set, detection count unchanged). So: use the prompt guards below to decide
  # WHETHER a toy is proposed, and DINOv2 to decide WHICH toy wins. Two
  # requirements for the proposal side:
  #  (1) build_ism_inputs_imu.py runs a SEPARATE YOLO pass per prompt — a shared
  #      set_classes(all) pass lets the stronger toy prompt NMS-suppress the other
  #      (bear prompt swallowed the white rabbit's box -> rabbit labeled Bear).
  #  (2) each toy uses '<color> <species> doll' + a score_threshold guard set from
  #      the measured cross-fire. Per-frame separate-pass conf (imgsz=960):
  #        brown bear  : 'brown bear doll' 0.67-0.80 | 'white rabbit doll' 0.05-0.17
  #        white rabbit: 'brown bear doll' 0.17-0.24 | 'white rabbit doll' 0.46-0.55
  #      -> Bear thr 0.35, Rabbit thr 0.30 separated them cleanly (both scenes).
  # Phase 1A (2026-07-22): per-object score_threshold guards REMOVED. GT-validated
  #   (935 visible-obj GT, LODO): the high guards also killed Rabbit's REAL candidates.
  #   Uniform defaults.score_threshold=0.02 => TP+27 / FN-27 / FP+-0. Cross-fire is now
  #   resolved downstream by DINOv2 semantic/appearance (+ future HSV gate), not by YOLO
  #   conf. Rollback = restore the three 'score_threshold' lines below.
  - name: Bear
    yolo_prompt: "brown bear doll"     # real bear 0.67-0.80; only 0.17-0.24 on the white rabbit
    object_id: Bear
    template_dir: template/Bear/templates
    cad_ply: data/cad/Bear/bear_color_with_normal_vertexcolor.ply
    enabled: true

  - name: Rabbit
    yolo_prompt: "white rabbit doll"   # real rabbit 0.46-0.55; only 0.05-0.17 on the brown bear ('white rabbit' fired 0 even on the real rabbit)
    # Phase 1A: score_threshold guard (was 0.30) removed -> inherits defaults 0.02 (recovers real Rabbit candidates)
    object_id: Rabbit
    template_dir: template/Rabbit/templates
    cad_ply: data/cad/Rabbit/Rabbit_color_with_normal_vertexcolor.ply
    # 2026-08-18: 포즈 추정 대상에서 제외. 자산·템플릿·데이터는 그대로 두고 플래그만 내린다.
    #   근거(NOTES 16·17절): 실제 영상에서 관측 조각 하나가 모델 6.8 군데에 똑같이 붙어
    #   (합성 이상치 1.1, Bear 3.5, saffron 1.4) 초기 포즈 후보가 동점으로 흩어진다.
    #   되돌리려면 enabled: true 로 바꾸기만 하면 된다.
    enabled: false

  - name: Dinosaur                     # light-green plush; not present in SAM_loop/occlusion scenes
    yolo_prompt: "green dinosaur doll"
    # Phase 1A: score_threshold guard (was 0.30) removed -> inherits defaults 0.02
    # Phase 1C: real dinosaur reads greener/bluer than the yellow-green render (H68~108 vs render 78).
    #   Shift THIS class's reference hue +9 OpenCV units (= +18 deg in 0-360) so the greener views
    #   match. Validated LODO-stable (+9 every fold): Dino TP 33->39, +0 new FP; +12 overshoots (->25).
    #   Baked into Dinosaur_hsv.npz at cache-build time -> runtime is object-agnostic (no Dino branch).
    hsv_hue_correction_ocv: 9
    object_id: Dinosaur
    template_dir: template/Dinosaur/templates
    cad_ply: data/cad/Dinosaur/Dinosaur_color_with_normal_vertexcolor.ply
    enabled: true
