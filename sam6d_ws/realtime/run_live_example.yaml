# SAM-6D 실시간 실행 설정 — 실제 카메라판 (노트북 운용)
#
# 먼저 카메라를 띄운다(별도 터미널, ROS 2 Jazzy realsense 환경):
#   ./run/realsense.sh
#   ※ align_depth 필수(depth 가 color 에 정렬돼 있어야 PEM 이 맞는 점군을 만든다)
#
# 그다음(별도 터미널, 단일 프로세스 검증용):
#   ros2 launch realtime/launch/sam6d_realtime.launch.py config:=realtime/run_live_example.yaml

topics:
  rgbd: /camera/camera/rgbd
  rgb: /camera/camera/color/image_raw
  depth: /camera/camera/aligned_depth_to_color/image_raw
  caminfo: /camera/camera/color/camera_info

ism:
  config: configs/yolo_ism_objects.yaml
  objects: []            # 그 장면에 없는 물체를 빼면 프레임당 시간이 그만큼 줄어든다

runtime:
  device: cuda:0
  use_sim_time: false    # 실제 카메라 = 실제 시계
  sync_slop: 0.02
  sync_queue: 30
  det_score_thresh: 0.2
  # 포즈 후보 텍스처 검증(Stage V). 기하 점수로 정렬한 상위 후보를 '입력 이미지의
  # 텍스처'와 '후보 포즈가 주장하는 모델 표면의 텍스처'로 맞대어 뒤집힘 여부를 판정하고,
  # 텍스처가 지지하는 후보로 승자를 교정한다. 판정(PASS/CORRECTED/AMBIGUOUS)과 신뢰도는
  # detections.jsonl 에 verify 로 남는다. 기본값·설명은 realtime/verify_config.py 참고.
  # verify 를 생략하면 Mask→Texture→수렴 검증이 기본으로 켜진다.
  # 예전 geometry-only 동작은 verify: null 로 명시한다.
  status_period_s: 1.0

output:
  dir: output/rt_live
  overlay_every: 0       # 노트북에서는 끄는 쪽이 빠르다
  write_jsonl: true

bag:
  play: false            # 카메라가 소스이므로 재생하지 않는다
