# 터미널 2 개 방식 — bag 재생판
#
#   터미널 A (먼저):  ros2 launch realtime/launch/sam6d_split.launch.py \
#                       config:=realtime/run_bagplay_split.yaml
#                     → "[infer] 준비 완료" 가 뜰 때까지 기다린다 (모델 적재 30~60 초)
#   터미널 B (그 뒤): ros2 bag play <bag 경로> --clock --rate 1.0
#
# 두 터미널 모두 conda activate sam6d && export ROS_DOMAIN_ID=72 를 먼저 할 것.

topics:
  rgb: /camera/camera/color/image_raw
  depth: /camera/camera/aligned_depth_to_color/image_raw
  caminfo: /camera/camera/color/camera_info

ism:
  config: configs/yolo_ism_objects.yaml
  objects: []                 # 비우면 config 의 활성 객체 전부(현재 9 개)

runtime:
  device: cuda:0
  use_sim_time: true          # bag 을 --clock 으로 재생하므로 true
  sync_slop: 0.02
  sync_queue: 30
  qos_reliability: reliable   # ⚠ best_effort 면 대량 유실된다 (NOTES 24절)
  qos_depth: 30
  det_score_thresh: 0.2
  # 포즈 후보 텍스처 검증(Stage V). 기하 점수로 정렬한 상위 후보를 '입력 이미지의
  # 텍스처'와 '후보 포즈가 주장하는 모델 표면의 텍스처'로 맞대어 뒤집힘 여부를 판정하고,
  # 텍스처가 지지하는 후보로 승자를 교정한다. 판정(PASS/CORRECTED/AMBIGUOUS)과 신뢰도는
  # detections.jsonl 에 verify 로 남는다. 기본값·설명은 realtime/verify_config.py 참고.
  #   appe_rerank: {topk: 100, w_geo: 2.0, stride: 1}     # 후보 재정렬(검증의 전제)
  #   verify: {enabled: true, w_col: 1.0, geo_guard: 0.9} # w_col 0 = 원색 채널 끄기
  #   mask_gate: {enabled: true, gate_guard: 0.85, min_keep: 5}  # ch1 마스크 비교(기본 ON)
  #   map_prior: {enabled: true, pose_source: both,              # ch2 Map 사전(기본 ON)
  #               extrinsic: calib/X_camSLAM_camSAM.npy}         #   포즈가 없으면 저절로 쉰다
  # ⚠ ch2 는 SLAM 자세를 받아야 동작한다. SAM-6D 는 ROS_DOMAIN_ID 72, ORB-SLAM3 는 71 로
  #   갈라져 있으니(README §5) 도메인을 맞추거나 브리지를 놓아야 한다.
  # ⚠ 게이트를 완전히 끄고 예전과 **비트 단위로 같게** 하려면: mask_gate: null / map_prior: null
  # 둘 다 생략하면 기하 점수만 쓰는 예전 동작이다(기본값).
  status_period_s: 1.0
  idle_exit_s: 30             # 첫 프레임을 받은 뒤 입력이 끊기면 추론이 스스로 종료

output:
  dir: output/live_bag
  diagnostics: true           # frames/detections jsonl + 마스크 (영상 렌더에 필요)

bag:
  play: false                 # 재생은 터미널 B 에서 사람이 한다
