%YAML:1.0

# ORB-SLAM3 IMU-RGBD settings for Intel RealSense D455f (640x480).
# Derived from orbslam3_d455f_640x480_rgbd.yaml with an added IMU block.
# IMU.T_b_c1 (camera->IMU/body extrinsic) computed from the bag's own
#   /camera/camera/extrinsics/{depth_to_color,depth_to_gyro} messages:
#   T_b_c1 = T_gyro_depth * inv(T_color_depth)   (b = D455 IMU/gyro frame, c1 = color optical frame)
# IMU noise/random-walk are the standard ORB-SLAM3 RealSense (BMI0xx) values
#   (datasheet-derived nominal, NOT Allan-variance calibrated for this unit).

File.version: "1.0"
Camera.type: "PinHole"

Camera1.fx: 386.91818
Camera1.fy: 386.34717
Camera1.cx: 322.78406
Camera1.cy: 250.28000

Camera1.k1: -0.05636231
Camera1.k2: 0.06772762
Camera1.p1: 0.00034360
Camera1.p2: 0.00089074
Camera1.k3: -0.02240346

Camera.width: 640
Camera.height: 480
Camera.fps: 30
Camera.RGB: 1

Stereo.ThDepth: 40.0
Stereo.b: 0.0745

RGBD.DepthMapFactor: 1000.0

# ---------------- IMU ----------------
IMU.NoiseGyro: 1.7e-4      # rad/s/sqrt(Hz)
IMU.NoiseAcc: 2.0e-3       # m/s^2/sqrt(Hz)
IMU.GyroWalk: 1.9e-5       # rad/s^2/sqrt(Hz)
IMU.AccWalk: 3.0e-3        # m/s^3/sqrt(Hz)
IMU.Frequency: 200.0
IMU.InsertKFsWhenLost: 1

# Camera(color optical) -> Body(IMU) transform, row-major 4x4.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [  0.99999470,  0.00325035,  0.00020082,  0.02899635,
           -0.00325091,  0.99999066,  0.00285201,  0.00695434,
           -0.00019155, -0.00285265,  0.99999594,  0.01568098,
            0.0,         0.0,         0.0,         1.0 ]

ORBextractor.nFeatures: 1250
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
