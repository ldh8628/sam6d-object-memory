# Realtime-transition step S5b -- PURE LOCALIZATION, SAME-CAMERA case.
# This is the scenario the realtime system actually runs: the robot maps a place
# with its SLAM camera (105023) and later re-enters it with THE SAME camera
# (105319) and only estimates its pose. 105018 (the other run config) is the
# harder cross-camera case: that bag comes from the SAM camera, which looks in a
# different direction on the rig.
#
# Prereq: copy map_260714_105023.osa into this run's output dir.
dataset: 260714_jazzy_reloc_105319
bag:
  path: /home/ldh9501/temp_ws/CLI_environment/data_slam_converted/260714/105319__unlabeled/SLAM
  play: true
  clock: true
  rate: 1.0
  start_delay: 12.0
orbslam3:
  settings_path: /home/ldh9501/temp_ws/CLI_environment/orbslam_ws/data/orbslam3_260714_105319_rgbd_localize.yaml
topics:
  rgb: /camera/camera/color/image_raw
  depth: /camera/camera/aligned_depth_to_color/image_raw
frames:
  world: map
  camera: camera_color_optical_frame
runtime:
  save_map_points_on_shutdown: true
  localization_mode: true
dense_map:
  enabled: true
  save_pcd: true
  pcd_output_path: orbslam3_dense_map.pcd
output:
  dir: /home/ldh9501/temp_ws/CLI_environment/orbslam_ws/output/260714_jazzy/reloc_105319
  map_points_path: orbslam3_map_points.pcd
visualization:
  enabled: false
